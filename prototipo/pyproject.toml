[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wquestions-engine"
version = "0.1.0"
description = "WQuestions core engine: 7-axis fact model, ingest and query."
requires-python = ">=3.10"
dependencies = ["pandas>=2.0,<2.3"]

[tool.setuptools]
packages = ["wq"]
